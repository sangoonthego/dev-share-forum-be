services:
  db:
    image: ankane/pgvector:latest
    platform: linux/amd64
    container_name: devshare_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data 

volumes:
  pgdata: 